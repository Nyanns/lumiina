<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumiina — Illustration & Digital Art Community</title>
    <meta name="description" content="Discover, share, and appreciate authentic digital fan art, anime illustrations, and manga works from creators worldwide. Built for human artistry without artificial noise." />
    <meta name="keywords" content="anime fan art, digital art community, anime illustrations, pixiv alternative, manga drawing, vtuber fanart, digital artists, art sharing platform, indie illustrators" />
    <meta name="author" content="Lumiina" />
    <meta name="theme-color" content="#0096fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lumiina" />
    <meta name="application-name" content="Lumiina" />
    <meta name="msapplication-TileColor" content="#0096fa" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://lumiina.art/" />

    <!-- Open Graph / Facebook / Discord / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumiina" />
    <meta property="og:title" content="Lumiina — Illustration & Digital Art Community" />
    <meta property="og:description" content="Discover, share, and appreciate authentic digital fan art, anime illustrations, and manga works from creators worldwide." />
    <meta property="og:image" content="https://lumiina.art/lumi_ina_studio_hd.jpg" />
    <meta property="og:url" content="https://lumiina.art/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lumiina_art" />
    <meta name="twitter:creator" content="@lumiina_art" />
    <meta name="twitter:title" content="Lumiina — Illustration & Digital Art Community" />
    <meta name="twitter:description" content="Discover, share, and appreciate authentic digital fan art, anime illustrations, and manga works from creators worldwide." />
    <meta name="twitter:image" content="https://lumiina.art/lumi_ina_studio_hd.jpg" />

    <!-- Schema.org WebSite & Sitelinks Searchbox JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Lumiina",
      "alternateName": ["Lumiina Art", "Lumiina Illustration Community"],
      "url": "https://lumiina.art/",
      "description": "Lumiina is an independent illustration sharing community crafted for anime, manga, and digital fan art creators.",
      "publisher": {
        "@type": "Organization",
        "name": "Lumiina",
        "logo": {
          "@type": "ImageObject",
          "url": "https://lumiina.art/logo_icon.png"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://lumiina.art/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f1f3f7] dark:bg-[#121519] text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-sky-100 selection:text-sky-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
